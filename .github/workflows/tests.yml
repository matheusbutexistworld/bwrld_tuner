name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Só numpy e as ferramentas de teste. kivy e sounddevice ficam de fora
      # de propósito: core/ não importa nenhum dos dois, então a suíte roda
      # headless e sem PortAudio. Se um deles vazar para core/, o CI quebra —
      # que é exatamente o alarme que queremos.
      - name: Instalar dependências
        working-directory: bwrld_tuner
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -r requirements-dev.txt

      - name: Rodar testes
        working-directory: bwrld_tuner
        run: pytest --cov=core --cov-report=term-missing
